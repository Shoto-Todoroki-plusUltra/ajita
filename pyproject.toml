[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-workload-studio"
version = "0.1.0"
description = "Checkpoint 1A: independently verified classical TSP and explicit QUBO"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic==2.14.1", "ortools==9.15.6755"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
